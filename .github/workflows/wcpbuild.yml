name: WCP Build

on:
  workflow_dispatch:
    inputs:
      release_description:
        description: 'Short description for profile.json (spaces become hyphens)'
        required: false
        type: string
        default: 'Casync-panDXVK-for-PanVK-Mali'

permissions:
  actions: read
  contents: read

env:
  NAME_PREFIX: panDXVK-1.10.3-Casync

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install zstd
        run: sudo apt-get update -y && sudo apt-get install -y zstd

      - name: Get latest build SHA and run ID
        id: get-sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUNS=$(gh run list --repo ${{ github.repository }} --workflow build.yml --branch main \
            --status success --limit 20 --json headSha,databaseId)
          LIST=$(printf '%s' "$RUNS" | python3 -c '
          import sys, json
          for r in json.load(sys.stdin):
              print(r["headSha"], r["databaseId"])
          ')
          FULL_SHA=""
          RUN_ID=""
          while read -r SHA ID; do
            [ -z "$ID" ] && continue
            COUNT=$(gh api "repos/${{ github.repository }}/actions/runs/$ID/artifacts" --jq '.total_count')
            if [ "$COUNT" != "0" ]; then
              FULL_SHA="$SHA"
              RUN_ID="$ID"
              break
            fi
          done <<< "$LIST"
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful build.yml run with artifacts found on main."
            echo "::error::Run Build DXVK (x64 + x32) first."
            exit 1
          fi
          echo "full_sha=$FULL_SHA" >> "$GITHUB_OUTPUT"
          echo "sha=${FULL_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Check the build is the newest commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILT="${{ steps.get-sha.outputs.full_sha }}"
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha')
          echo "Packaging DLLs built from ${BUILT:0:7}, main is at ${HEAD_SHA:0:7}"
          if [ "$BUILT" != "$HEAD_SHA" ]; then
            echo "::warning::These DLLs are from ${BUILT:0:7} but main is at ${HEAD_SHA:0:7}. Run Build DXVK again to include the newest commit."
          fi

      - name: Package name
        run: |
          echo "PKG_NAME=${NAME_PREFIX}-${{ steps.get-sha.outputs.sha }}" >> "$GITHUB_ENV"

      - name: Download build DLLs
        uses: actions/download-artifact@v4
        with:
          name: dxvk-${{ steps.get-sha.outputs.full_sha }}
          path: ./workdir
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.get-sha.outputs.run_id }}

      - name: Restructure for WCP
        run: |
          cd ./workdir
          VDIR="$(ls -d dxvk-*/)"
          mv "$VDIR/x64" ./
          mv "$VDIR/x32" ./
          rm -rf "$VDIR"

      - name: Prepare DLL directories
        run: |
          cd ./workdir
          mv x64 system32
          mv x32 syswow64

      - name: Package WCP
        env:
          RELEASE_DESC: ${{ inputs.release_description }}
        run: |
          cd ./workdir
          python3 - <<'PY'
          import json, os

          desc = '-'.join(os.environ['RELEASE_DESC'].replace('/', ' ').split())
          if not desc:
              desc = 'Casync-panDXVK'

          dlls = ['d3d9', 'd3d10', 'd3d10_1', 'd3d10core', 'd3d11', 'dxgi']
          files = []
          for folder, var in (('system32', '${system32}'), ('syswow64', '${syswow64}')):
              for name in dlls:
                  files.append({
                      'source': folder + '/' + name + '.dll',
                      'target': var + '/' + name + '.dll',
                  })

          profile = {
              'type': 'DXVK',
              'versionName': os.environ['PKG_NAME'],
              'versionCode': 0,
              'description': desc,
              'files': files,
          }

          with open('profile.json', 'w') as f:
              json.dump(profile, f, indent=2)
          PY

          cat profile.json
          tar -cf ../pandxvk.tar system32/ syswow64/ profile.json
          zstd -22 -f ../pandxvk.tar -o "../${PKG_NAME}.wcp"
          rm ../pandxvk.tar
          ls -l "../${PKG_NAME}.wcp"

      - name: Upload WCP
        uses: actions/upload-artifact@v4
        with:
          name: wcp-${{ env.PKG_NAME }}
          path: ./${{ env.PKG_NAME }}.wcp
          compression-level: 0
